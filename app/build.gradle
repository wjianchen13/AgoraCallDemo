plugins {
    alias(libs.plugins.android.application)
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file("local.properties")
if (localPropertiesFile.exists()) {
    localPropertiesFile.withInputStream { localProperties.load(it) }
}
def agoraAppId = localProperties.getProperty("AGORA_APP_ID", "")
def agoraAppCert = localProperties.getProperty("AGORA_APP_CERT", "")
def yunxinAppKey = localProperties.getProperty("YUNXIN_APP_KEY", "YOUR_YUNXIN_APP_KEY")
def yunxinAccountId = localProperties.getProperty("YUNXIN_ACCOUNT_ID", "YOUR_YUNXIN_ACCOUNT_ID")
def yunxinAccountToken = localProperties.getProperty("YUNXIN_ACCOUNT_TOKEN", "YOUR_YUNXIN_ACCOUNT_TOKEN")
def buildConfigString = { value ->
    "\"${value.replace('\\', '\\\\').replace('\"', '\\\"')}\""
}

android {
    namespace 'com.example.agoracalldemo'
    compileSdk {
        version = release(36) {
            minorApiLevel = 1
        }
    }

    defaultConfig {
        applicationId "com.example.agoracalldemo"
        minSdk 24
        targetSdk 36
        versionCode 1
        versionName "1.0"

        // Demo only. AGORA_APP_CERT must be moved to a server before production.
        buildConfigField "String", "AGORA_APP_ID", buildConfigString(agoraAppId)
        buildConfigField "String", "AGORA_APP_CERT", buildConfigString(agoraAppCert)
        buildConfigField "String", "YUNXIN_APP_KEY", buildConfigString(yunxinAppKey)
        buildConfigField "String", "YUNXIN_ACCOUNT_ID", buildConfigString(yunxinAccountId)
        buildConfigField "String", "YUNXIN_ACCOUNT_TOKEN", buildConfigString(yunxinAccountToken)

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            optimization {
                enable false
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    buildFeatures {
        viewBinding true
        buildConfig true
    }
}

dependencies {
    implementation project(':core')
    implementation libs.activity.ktx
    implementation libs.appcompat
    implementation libs.constraintlayout
    implementation libs.material
    implementation libs.navigation.fragment
    implementation libs.navigation.ui
    testImplementation libs.junit
    androidTestImplementation libs.espresso.core
    androidTestImplementation libs.ext.junit
}
